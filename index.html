<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complex Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <table>
        <caption>Complex Table</caption>

        <thead>
            <tr>
                <th>Year</th>
                <th>Group</th>
                <th>Language</th>
                <th>Done</th>
                <th>Passed</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="5" class="center">2022</td>
                <td rowspan="2" class="center">Elzero</td>
                <td>HTML</td>
                <td colspan="2">Yes</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td colspan="2">Yes</td>
            </tr>
            <tr>
                <td rowspan="3" class="center">Heroes</td>
                <td>JS</td>
                <td>Yes</td>
                <td>No</td>
            </tr>
            <tr>
                <td>PHP</td>
                <td colspan="2">Yes</td>
            </tr>
            <tr>
                <td>Python</td>
                <td>No</td>
                <td>No</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
